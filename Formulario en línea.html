<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="Estilos de formulario.css">
</head>
<body> 
    <div class="form-container">
       <h2>Okini</h2><center><p><img src="Barra de Okini.png"; width="250"; height="90"></p></center>
        <h3>Contactos </h3><center><p><img src="Contactos.png"; width="153"; height="93"></p></center>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Nombre completo:</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre completo...">
                <span class="error-message" id="nameError">El nombre es obligatorio.</span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
                <span class="error-message" id="emailError">Por favor, introduce un correo válido.</span>
            </div>
            <div class="form-group">
                <label for="message">Mensaje:</label>
                <textarea id="message" name="message" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                <span class="error-message" id="messageError">El mensaje no lo puedes dejar vacío.</span>
            </div><p>
    <label><b>¿Qué tipo de café quieres?:</b><p><select name="servicio"><option>Normal</option><option>Con leche</option><option>V60</option><option>Kyoto Drip</option><option>Prensa Francesa</option><option>Siphon japonés</option><option>Con cremora</option><option>Capuchinno</option></select></label></p>
            <button type="submit">Enviar Mensaje</button>
            <div class="success-message" id="successMessage">¡Formulario enviado con éxito!</div>
        </form>
    </div><br>
<h4>© 2026. Okini</h4>
    <!-- Vinculación del archivo JavaScript -->
    <script src="Funciones del formulario.js"></script>
</body>
</html>
